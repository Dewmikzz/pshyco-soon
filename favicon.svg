<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="laptopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Laptop screen -->
  <rect x="15" y="20" width="70" height="45" rx="3" fill="url(#laptopGradient)" stroke="url(#laptopGradient)" stroke-width="2"/>
  
  <!-- Screen glow -->
  <rect x="15" y="20" width="70" height="45" rx="3" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5" filter="url(#blur)"/>
  
  <!-- Laptop base -->
  <path d="M 10 65 L 15 65 L 15 70 Q 15 72 17 72 L 83 72 Q 85 72 85 70 L 85 65 L 90 65 Q 92 65 92 67 L 92 78 Q 92 80 90 80 L 10 80 Q 8 80 8 78 L 8 67 Q 8 65 10 65 Z" fill="url(#laptopGradient)" stroke="url(#laptopGradient)" stroke-width="2"/>
  
  <!-- Inner glow -->
  <circle cx="50" cy="42" r="25" fill="#00d4ff" opacity="0.1" filter="url(#blur)"/>
  
  <!-- Blur filter for glow effect -->
  <filter id="blur">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
  </filter>
</svg>
