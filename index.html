<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyco Lab - Coming Soon</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="animated-bg">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>
        <canvas id="canvas"></canvas>
    </div>

    <div class="container">
        <div class="content">
            <!-- Header with animated logo -->
            <div class="header">
                <div class="company-name-typing">
                    <h2 class="typing-text">Pshyco Lab</h2>
                    <span class="typing-cursor"></span>
                </div>
                <div class="logo-container">
                    <div class="logo-text">
                        <span class="letter" style="--delay: 0s">P</span>
                        <span class="letter" style="--delay: 0.1s">s</span>
                        <span class="letter" style="--delay: 0.2s">y</span>
                        <span class="letter" style="--delay: 0.3s">c</span>
                        <span class="letter" style="--delay: 0.4s">o</span>
                    </div>
                    <div class="logo-subtext">
                        <span class="letter" style="--delay: 0.5s">L</span>
                        <span class="letter" style="--delay: 0.6s">a</span>
                        <span class="letter" style="--delay: 0.7s">b</span>
                    </div>
                </div>
            </div>

            <!-- Main content -->
            <div class="main-content">
                <h1 class="title">
                    <span class="title-word">Dream</span>
                    <span class="title-word">Design</span>
                    <span class="title-word">Build</span>
                    <span class="title-word">Smart</span>
                </h1>

                <div class="coming-soon-text">
                    <span class="text-line">Something</span>
                    <span class="text-line">Extraordinary is</span>
                    <span class="text-line"><span class="highlight">Coming Soon</span></span>
                </div>

                <p class="description">
                    We're crafting the future of intelligent solutions. Stay tuned for innovation that transforms ideas into reality.
                </p>

                <!-- Email signup -->
                <div class="email-section">
                    <div class="input-group">
                        <input type="email" id="emailInput" placeholder="Enter your email" class="email-input">
                        <button class="subscribe-btn">Notify Me</button>
                    </div>
                    <p class="privacy-text">We'll notify you when we launch</p>
                </div>

                <!-- Social links -->
                <div class="social-links">
                    <a href="#" class="social-icon" aria-label="Twitter">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2s9 5 20 5a9.5 9.5 0 00-9-5.5c4.75 2.25 10.25 2.25 13-7a4.5 4.5 0 00-8-2v-1a4.5 4.5 0 008-4"/>
                        </svg>
                    </a>
                    <a href="#" class="social-icon" aria-label="LinkedIn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/>
                            <circle cx="4" cy="4" r="2"/>
                        </svg>
                    </a>
                    <a href="#" class="social-icon" aria-label="GitHub">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                    </a>
                    <a href="#" class="social-icon" aria-label="Instagram">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" fill="white"/>
                            <circle cx="17.5" cy="6.5" r="1.5" fill="white"/>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- Floating elements -->
            <div class="floating-element floating-1">
                <div class="element-icon">💡</div>
            </div>
            <div class="floating-element floating-2">
                <div class="element-icon">🚀</div>
            </div>
            <div class="floating-element floating-3">
                <div class="element-icon">⚡</div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
